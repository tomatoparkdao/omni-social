server {
    listen 80;
    server_name _;
    client_max_body_size 170m;

    location /api/ {
        proxy_pass http://web:5409/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location / {
        proxy_pass http://web:5409;
        proxy_set_header Host $http_host;
    }
}
