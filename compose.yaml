services:
  web:
    build: .
    restart: unless-stopped
    environment:
      OMNISOCIAL_ENV: production
      OMNISOCIAL_ENABLE_REAL_PUBLISH: ${OMNISOCIAL_ENABLE_REAL_PUBLISH:-0}
      OMNISOCIAL_SESSION_SECRET: ${OMNISOCIAL_SESSION_SECRET:?Set a random session secret in .env}
      OMNISOCIAL_ADMIN_PASSWORD_HASH: ${OMNISOCIAL_ADMIN_PASSWORD_HASH:?Set a password hash in .env}
    volumes:
      - db_data:/app/db
      - material_data:/app/videoFile
      - cookie_data:/app/cookiesFile
      - cli_cookie_data:/app/cookies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5409/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

  worker:
    build: .
    profiles: ["publish"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "sau_publish_worker.py"]
    environment:
      OMNISOCIAL_ENV: production
      OMNISOCIAL_ENABLE_REAL_PUBLISH: ${OMNISOCIAL_ENABLE_REAL_PUBLISH:-0}
      OMNISOCIAL_SESSION_SECRET: ${OMNISOCIAL_SESSION_SECRET:?Set a random session secret in .env}
      OMNISOCIAL_ADMIN_PASSWORD_HASH: ${OMNISOCIAL_ADMIN_PASSWORD_HASH:?Set a password hash in .env}
    volumes:
      - db_data:/app/db
      - material_data:/app/videoFile
      - cookie_data:/app/cookiesFile
      - cli_cookie_data:/app/cookies

volumes:
  db_data:
  material_data:
  cookie_data:
  cli_cookie_data:
